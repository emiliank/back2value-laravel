<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Ilustrim: energji e pastër me bateri industriale, panele solare, turbina erës dhe ekonomi rrethore">
    <defs>
        <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f7fcfa"/>
            <stop offset="1" stop-color="#e7f6f0"/>
        </linearGradient>
        <path id="turbineBlade" d="M104 186 C98 148 100 118 110 92 C120 118 122 148 116 186 Z"/>
    </defs>

    <rect width="960" height="440" rx="28" fill="url(#heroBg)"/>
    <rect x="1" y="1" width="958" height="438" rx="27" fill="none" stroke="#d5ece3" stroke-width="2"/>

    <!-- Sun -->
    <circle cx="330" cy="80" r="26" fill="#ffc857"/>

    <!-- Wind turbine -->
    <path d="M110 356 V190" stroke="#101b32" stroke-width="7" stroke-linecap="round"/>
    <use href="#turbineBlade" fill="#101b32"/>
    <use href="#turbineBlade" fill="#101b32" transform="rotate(120 110 186)"/>
    <use href="#turbineBlade" fill="#101b32" transform="rotate(240 110 186)"/>
    <circle cx="110" cy="186" r="9" fill="#17b78b"/>

    <!-- Solar panel -->
    <path d="M132 344 L132 356 M196 344 L196 356" stroke="#101b32" stroke-width="6" stroke-linecap="round"/>
    <path d="M64 344 L98 258 L250 258 L216 344 Z" fill="#101b32"/>
    <path d="M148 258 L114 344 M198 258 L164 344 M81 301 L233 301" stroke="#ffffff" stroke-width="3" opacity="0.35"/>

    <!-- Ground -->
    <path d="M40 356 H920" stroke="#cfe9e0" stroke-width="4" stroke-linecap="round"/>

    <!-- Circular-flow arrows -->
    <path d="M364 214 C334 254 338 306 372 340" stroke="#0f8f6d" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M372 348 L356 324 L390 326 Z" fill="#0f8f6d"/>
    <path d="M628 214 C658 254 654 306 620 340" stroke="#0f8f6d" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M620 348 L636 324 L602 326 Z" fill="#0f8f6d"/>

    <!-- Battery -->
    <rect x="424" y="138" width="46" height="20" rx="6" fill="#101b32"/>
    <rect x="522" y="138" width="46" height="20" rx="6" fill="#101b32"/>
    <rect x="438" y="145.5" width="18" height="5" rx="2.5" fill="#ffffff"/>
    <rect x="536" y="145.5" width="18" height="5" rx="2.5" fill="#ffffff"/>
    <rect x="542.5" y="139" width="5" height="18" rx="2.5" fill="#ffffff"/>
    <rect x="396" y="154" width="200" height="192" rx="18" fill="#ffffff" stroke="#101b32" stroke-width="5"/>
    <rect x="412" y="234" width="168" height="96" rx="10" fill="#17b78b"/>
    <path d="M506 246 L474 296 L494 296 L486 328 L520 282 L500 282 Z" fill="#ffffff"/>

    <!-- Factory -->
    <rect x="866" y="168" width="24" height="90" fill="#101b32"/>
    <rect x="706" y="250" width="190" height="106" rx="10" fill="#101b32"/>
    <path d="M706 250 L741 218 L776 250 Z M776 250 L811 218 L846 250 Z M846 250 L871 228 L896 250 Z" fill="#101b32"/>
    <rect x="726" y="274" width="22" height="22" rx="4" fill="#17b78b"/>
    <rect x="760" y="274" width="22" height="22" rx="4" fill="#17b78b"/>
    <rect x="794" y="274" width="22" height="22" rx="4" fill="#17b78b"/>
    <rect x="726" y="308" width="22" height="22" rx="4" fill="#17b78b" opacity="0.6"/>
    <rect x="760" y="308" width="22" height="22" rx="4" fill="#17b78b" opacity="0.6"/>
    <rect x="794" y="308" width="22" height="22" rx="4" fill="#17b78b" opacity="0.6"/>
    <rect x="838" y="302" width="34" height="54" rx="6" fill="#0f6a52"/>
    <path d="M878 154 C864 147 862 131 876 122 C891 129 893 147 878 154 Z" fill="#17b78b"/>

    <!-- Sparkles -->
    <circle cx="640" cy="108" r="6" fill="#17b78b" opacity="0.45"/>
    <circle cx="666" cy="150" r="4" fill="#17b78b" opacity="0.4"/>
    <circle cx="368" cy="148" r="5" fill="#17b78b" opacity="0.4"/>
